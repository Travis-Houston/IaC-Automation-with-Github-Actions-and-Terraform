name: 'Terraform Destroy'

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering from GitHub Actions UI
    inputs:
      workspace:
        description: 'Workspace name to destroy (optional)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_CLOUD_ORGANIZATION: "Terraform-Labs-2025"

jobs:
  # JOB 1: Detect Deleted Workspaces
  detect-deleted-workspaces:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_deletions: ${{ steps.set-matrix.outputs.has_deletions }}
    permissions:
      contents: read
    steps:
      - name: Checkout current code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get deleted directories
        id: deleted-dirs
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          dir_names_max_depth: 2
          json: true
          files: |
            **/*.tf
            **/*.hcl
          files_ignore: |
            .github/**
            **/.terraform/**

      - name: Identify deleted workspaces
        id: set-matrix
        run: |
          set -e
          
          DELETED_FILES='${{ steps.deleted-dirs.outputs.deleted_files }}'
          echo "Deleted files: $DELETED_FILES"
          
          # Extract unique directories from deleted files
          DELETED_DIRS=$(echo "$DELETED_FILES" | jq -r '.[]' | xargs -r dirname | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          echo "Deleted directories: $DELETED_DIRS"
          
          # Check if any directories were actually deleted
          DIR_COUNT=$(echo "$DELETED_DIRS" | jq 'length')
          
          if [ "$DIR_COUNT" -gt 0 ]; then
            echo "has_deletions=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$DELETED_DIRS" >> "$GITHUB_OUTPUT"
            echo "::notice::Found $DIR_COUNT deleted workspace(s)"
          else
            echo "has_deletions=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "::notice::No workspace deletions detected"
          fi

  # JOB 2: Destroy Deleted Workspaces
  terraform-destroy:
    needs: detect-deleted-workspaces
    if: ${{ needs.detect-deleted-workspaces.outputs.has_deletions == 'true' || github.event_name == 'workflow_dispatch' }}
    name: "Destroy - ${{ matrix.folder || github.event.inputs.workspace || 'Manual' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ github.event_name == 'workflow_dispatch' && fromJson('["manual"]') || fromJson(needs.detect-deleted-workspaces.outputs.matrix) }}
    
    env:
      TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"

    steps:
      - name: Checkout previous commit
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}

      - name: Checkout current code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Resolve Workspace Name
        id: ws-name
        run: |
          set -e
          
          # For manual triggers with workspace input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.workspace }}" ]; then
            WS_NAME="${{ github.event.inputs.workspace }}"
            echo "Using manually specified workspace: $WS_NAME"
            echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # For automated detection from deleted folders
          FOLDER="${{ matrix.folder }}"
          
          if [ ! -d "$FOLDER" ]; then
            echo "::error::Folder $FOLDER does not exist in previous commit"
            exit 1
          fi
          
          cd "$FOLDER"
          
          # Extract workspace name from backend.tf or other .tf files
          WS_NAME=$(grep -h "name[[:space:]]*=" *.tf 2>/dev/null | grep -v "#" | grep "workspaces" -A 1 | grep "name" | head -n 1 | awk -F'"' '{print $2}')
          
          if [ -z "$WS_NAME" ]; then
            WS_NAME=$(basename "$FOLDER")
            echo "::warning::Workspace name not found in TF files. Using folder name: $WS_NAME"
          fi
          
          echo "Detected Workspace: $WS_NAME"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_version: "1.6.0"

      - name: Configure Terraform Backend
        if: github.event_name != 'workflow_dispatch'
        working-directory: ${{ matrix.folder }}
        run: |
          # Ensure backend.tf exists and is properly configured
          if [ ! -f "backend.tf" ]; then
            echo "::warning::backend.tf not found, creating one"
            cat > backend.tf <<EOF
          terraform {
            cloud {
              organization = "${{ env.TF_CLOUD_ORGANIZATION }}"
              workspaces {
                name = "${{ steps.ws-name.outputs.workspace }}"
              }
            }
          }
          EOF
          fi

      - name: Terraform Init
        if: github.event_name != 'workflow_dispatch'
        working-directory: ${{ matrix.folder }}
        run: terraform init
        env:
          TF_LOG: ERROR

      - name: Terraform Init (Manual)
        if: github.event_name == 'workflow_dispatch'
        run: terraform init
        env:
          TF_LOG: ERROR

      - name: Terraform Destroy
        if: github.event_name != 'workflow_dispatch'
        working-directory: ${{ matrix.folder }}
        run: |
          echo "::warning::Destroying workspace: ${{ steps.ws-name.outputs.workspace }}"
          terraform destroy -auto-approve
        env:
          TF_LOG: ERROR

      - name: Terraform Destroy (Manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::warning::Destroying workspace: ${{ steps.ws-name.outputs.workspace }}"
          terraform destroy -auto-approve
        env:
          TF_LOG: ERROR

      - name: Delete Terraform Cloud Workspace
        run: |
          set -e
          
          WS_NAME="${{ steps.ws-name.outputs.workspace }}"
          ORG="${{ env.TF_CLOUD_ORGANIZATION }}"
          
          echo "Attempting to delete workspace '$WS_NAME' from Terraform Cloud..."
          
          # Get workspace ID
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --header "Authorization: Bearer ${{ secrets.TF_API_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/$ORG/workspaces/$WS_NAME")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::notice::Workspace '$WS_NAME' not found in Terraform Cloud (already deleted or never existed)"
            exit 0
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to get workspace details (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi
          
          WS_ID=$(echo "$BODY" | jq -r '.data.id')
          
          if [ -z "$WS_ID" ] || [ "$WS_ID" = "null" ]; then
            echo "::error::Could not extract workspace ID"
            exit 1
          fi
          
          # Delete the workspace
          DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
            --header "Authorization: Bearer ${{ secrets.TF_API_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/$WS_ID")
          
          DELETE_HTTP_CODE=$(echo "$DELETE_RESPONSE" | tail -n1)
          
          if [ "$DELETE_HTTP_CODE" = "204" ]; then
            echo "::notice::Successfully deleted workspace '$WS_NAME' from Terraform Cloud"
          else
            echo "::error::Failed to delete workspace (HTTP $DELETE_HTTP_CODE)"
            echo "$DELETE_RESPONSE" | head -n-1
            exit 1
          fi