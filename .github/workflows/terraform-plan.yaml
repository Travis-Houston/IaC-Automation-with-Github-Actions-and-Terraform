name: "Terraform Plan"

on:
  pull_request:

# Replace an older run when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Detect changed Terraform roots
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.changed-files.outputs.all_changed_files || '[]' }}
    steps:
      - name: Get changed Terraform directories
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          use_rest_api: true
          dir_names: true
          dir_names_max_depth: 2
          matrix: true
          files: |
            **/*.tf
            **/*.tf.json
            **/*.tfvars
            **/*.tfvars.json
            **/.terraform.lock.hcl
          files_ignore: |
            .github/**
            **/.terraform/**

  # JOB 2: Validate, format, and scan each changed root
  terraform-scan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    name: Terraform Checks - ${{ matrix.folder }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        id: validate
        working-directory: ${{ matrix.folder }}
        run: terraform validate

      - name: Terraform Format
        id: fmt
        working-directory: ${{ matrix.folder }}
        run: terraform fmt -check -recursive

      # Run scans even if init, validate, or fmt failed; skip if cancelled or
      # the changed directory is not a Terraform root.
      - name: Terraform Static Scan
        id: static-scan
        if: ${{ !cancelled() }}
        uses: ./.github/actions/terraform-static-scan
        with:
          directory: ${{ matrix.folder }}

      - name: Record check results
        if: ${{ always() }}
        env:
          VALIDATE_RESULT: ${{ steps.validate.outcome }}
          FORMAT_RESULT: ${{ steps.fmt.outcome }}
          STATIC_SCAN_RESULT: ${{ steps.static-scan.outcome }}
        run: |
          mkdir -p .terraform-check-results
          cat > .terraform-check-results/results.json <<EOF
          {"validate":"${VALIDATE_RESULT}","format":"${FORMAT_RESULT}","static_scan":"${STATIC_SCAN_RESULT}"}
          EOF

      - name: Upload check results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-check-results-${{ strategy.job-index }}
          path: .terraform-check-results/results.json
          if-no-files-found: error

  # JOB 3: Run speculative HCP Terraform plans after scans pass
  terraform-plan:
    needs: [detect-changes, terraform-scan]
    if: ${{ always() && needs.detect-changes.outputs.matrix != '[]' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Terraform Plan - ${{ matrix.folder }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download check results
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          name: terraform-check-results-${{ strategy.job-index }}
          path: .terraform-check-results

      - name: Determine whether this root passed checks
        id: check-results
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path(".terraform-check-results/results.json").read_text())
          passed = all(results.get(check) == "success" for check in ("validate", "format", "static_scan"))
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"checks_passed={'true' if passed else 'false'}\n")
          PY

      # Assumes the folder's basename exactly matches its HCP Terraform workspace name.
      - name: Resolve HCP Terraform workspace
        id: ws-name
        env:
          TF_ROOT: ${{ matrix.folder }}
        run: |
          set -euo pipefail
          WS_NAME="$(basename -- "$TF_ROOT")"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Configuration
        if: ${{ steps.check-results.outputs.checks_passed == 'true' }}
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: plan-upload
        with:
          organization: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ steps.ws-name.outputs.workspace }}
          directory: "./"
          speculative: true

      - name: Create Plan Run
        if: ${{ steps.check-results.outputs.checks_passed == 'true' }}
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: plan-run
        with:
          organization: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ steps.ws-name.outputs.workspace }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get Plan Output
        if: ${{ steps.check-results.outputs.checks_passed == 'true' }}
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
        id: plan-output
        with:
          organization: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          plan: ${{ steps.plan-run.outputs.plan_id }}

      # Update this workspace's comment on the PR instead of adding one per commit.
      - name: Update PR Comment
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@v9
        env:
          TF_WORKSPACE_NAME: ${{ steps.ws-name.outputs.workspace }}
          TF_ROOT: ${{ matrix.folder }}
          CHECK_RESULTS_FILE: .terraform-check-results/results.json
          CHECKS_PASSED: ${{ steps.check-results.outputs.checks_passed }}
          PLAN_RUN_OUTCOME: ${{ steps.plan-run.outcome }}
          PLAN_OUTPUT_OUTCOME: ${{ steps.plan-output.outcome }}
          HCP_RUN_LINK: ${{ steps.plan-run.outputs.run_link }}
          PLAN_ADD: ${{ steps.plan-output.outputs.add }}
          PLAN_CHANGE: ${{ steps.plan-output.outputs.change }}
          PLAN_DESTROY: ${{ steps.plan-output.outputs.destroy }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workspace =
              process.env.TF_WORKSPACE_NAME || process.env.TF_ROOT;
            const marker = `<!-- terraform-report:${workspace} -->`;

            const label = (outcome) => ({
              success: "Passed",
              failure: "Failed",
              cancelled: "Cancelled",
              skipped: "Not run",
            }[outcome] || "Unknown");

            let checkResults = {};
            try {
              checkResults = JSON.parse(
                require("fs").readFileSync(process.env.CHECK_RESULTS_FILE, "utf8"),
              );
            } catch (error) {
              core.warning(`Could not read Terraform check results: ${error.message}`);
            }

            const formatStatus = label(checkResults.format);
            const validateStatus = label(checkResults.validate);
            const staticScanStatus = label(checkResults.static_scan);
            const planStatus = label(process.env.PLAN_RUN_OUTCOME);
            const outputStatus = label(process.env.PLAN_OUTPUT_OUTCOME);

            const planDetails =
              process.env.PLAN_OUTPUT_OUTCOME === "success"
                ? [
                    "",
                    "| Plan action | Count |",
                    "| :--- | ---: |",
                    `| Add | **${process.env.PLAN_ADD || "0"}** |`,
                    `| Change | **${process.env.PLAN_CHANGE || "0"}** |`,
                    `| Destroy | **${process.env.PLAN_DESTROY || "0"}** |`,
                  ]
                : ["", "Plan counts are unavailable; check the Actions run for details."];

            const runLink = process.env.HCP_RUN_LINK
              ? `[View speculative plan in HCP Terraform](${process.env.HCP_RUN_LINK})`
              : "HCP Terraform run link unavailable.";

            const body = [
              marker,
              `### Terraform Checks & Plan: \`${workspace}\``,
              "",
              "| Check | Status |",
              "| :--- | :--- |",
              `| Terraform format | ${formatStatus} |`,
              `| Terraform validate | ${validateStatus} |`,
              `| Terraform static scan | ${staticScanStatus} |`,
              `| HCP Terraform plan | ${planStatus} |`,
              `| Plan output | ${outputStatus} |`,
              ...planDetails,
              "",
              runLink,
              "",
              `*Triggered by @${context.actor} · Commit \`${context.sha.substring(0, 7)}\`*`,
            ].join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );

            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
