name: "Terraform Plan"

on:
  pull_request:

# Cancel old runs when a new commit is pushed to the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_CLOUD_ORGANIZATION: "${{ secrets.TF_CLOUD_ORGANIZATION }}"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"

jobs:
  # JOB 1: Detect Changed Folders
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.changed-files.outputs.all_changed_files || '[]' }}
    steps:
      - name: Get changed Terraform directories
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          use_rest_api: true
          dir_names: true
          dir_names_max_depth: 2
          matrix: true
          files: |
            **/*.tf
            **/*.tf.json
            **/*.tfvars
            **/*.tfvars.json
            **/*.hcl
          files_ignore: |
            .github/**
            **/.terraform/**

  # JOB 2: Run scans (Validation, Format, Security Scan)
  terraform-scan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    name: Terraform Checks - ${{ matrix.folder }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.folder }}
        run: terraform validate

      - name: Terraform Format
        working-directory: ${{ matrix.folder }}
        run: terraform fmt -check -recursive

      - name: Terraform Static Scan
        if: ${{ !cancelled() }}
        uses: ./.github/actions/terraform-static-scan
        with:
          directory: ${{ matrix.folder }}

  # JOB 3: Run Plan after unit tests pass
  terraform-plan:
    needs: [detect-changes, terraform-scan]
    if: >-
      ${{ needs.detect-changes.outputs.matrix != '[]' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    name: Plan - ${{ matrix.folder }}
    runs-on: ubuntu-latest
    env:
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    permissions:
      contents: read
      # Add pull-requests: write if you enable the PR-comment step.
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- STEP: Determine Workspace Name ---
      - name: Resolve Workspace Name
        id: ws-name
        working-directory: ${{ matrix.folder }}
        env:
          TF_ROOT: ${{ matrix.folder }}
        run: |
          # Keep your current workspace lookup here.
          # For the fallback:
          WS_NAME="$(basename -- "$TF_ROOT")"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      # --- STEP: Upload & Plan ---
      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: plan-upload
        with:
          workspace: ${{ steps.ws-name.outputs.workspace }}
          directory: "./"
          speculative: true # IMPORTANT: This ensures it's a "Plan Only" in TFC

      - name: Create Plan Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: plan-run
        with:
          workspace: ${{ steps.ws-name.outputs.workspace }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get Plan Output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
        id: plan-output
        with:
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}

